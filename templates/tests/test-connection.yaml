apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "pecan.fullname" . }}-test-connection"
  labels:
    {{- include "pecan.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test-success
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args:  ['-q', '-O', '-', 'http://{{ include "pecan.fullname" . }}-docs:{{ .Values.docs.service.port }}/']
  restartPolicy: Never
