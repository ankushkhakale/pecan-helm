{{- if .Values.initializeData }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pecan.fullname" . }}-load-data
  labels:
    {{- include "pecan.labels" . | nindent 4 }}
spec:
  # Keep the Job so its result can be observed (helm --wait-for-jobs, kubectl).
  # A failed load is a data problem; do not re-run a non-transactional loader.
  backoffLimit: 0
  template:
    metadata:
      name: "{{.Release.Name}}"
      labels:
        app.kubernetes.io/name: {{ include "pecan.fullname" . }}-load-data
        app.kubernetes.io/instance: {{ $.Release.Name }}
    spec:
      restartPolicy: Never
    {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      initContainers:
        - name: check-postgresql
          image: "{{ $.Values.image.checks }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "pecan.env.postgresql" . | nindent 12 }}
            - name: PGDATABASE
              value: {{ .Values.betydb.betyDatabase | quote }}
            - name: PG_TABLE
              value: "yields"
      containers:
        - name: add-data
          image: "{{ .Values.image.project }}/data:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The image's own command ignores psql failures and exits 0.
          # Run the same script with errexit so a failed statement fails the Job.
          command: ["bash", "-e", "/work/add-data.sh"]
          volumeMounts:
            - name: data
              mountPath: /data
          env:
            {{- include "pecan.env.postgresql" . | nindent 12 }}
            {{- include "pecan.env.cluster" . | nindent 12 }}
            - name: PSQL
              value: "psql -d {{ .Values.betydb.betyDatabase }} -q -t -c"
      volumes:
        - name: data
          persistentVolumeClaim:
{{- if .Values.persistence.existingClaim }}
            claimName: {{ .Values.persistence.existingClaim }}
{{- else }}
            claimName: {{ include "pecan.fullname" . }}-data
{{- end }}
{{- end }}
