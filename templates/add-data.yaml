{{- if .Values.initializeData }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pecan.fullname" . }}-load-data
  labels:
    {{- include "pecan.labels" . | nindent 4 }}
spec:
  ttlSecondsAfterFinished: 1
  template:
    metadata:
      name: "{{.Release.Name}}"
      labels:
        app.kubernetes.io/name: {{ include "pecan.fullname" . }}-load-data
        app.kubernetes.io/instance: {{ $.Release.Name }}
    spec:
      restartPolicy: Never
    {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      initContainers:
        # Wait for BETY's validated readiness record (the same initializer image
        # and `wait` protocol as the BETY Deployment gate), not for a table to
        # exist: the restore creates tables before validation finishes.
        - name: wait-database-ready
          image: {{ required "betydb.bootstrap.image is required: an initializer image implementing bootstrap/check/wait" $.Values.betydb.bootstrap.image | quote }}
          imagePullPolicy: {{ $.Values.betydb.bootstrap.pullPolicy }}
          args: ["wait"]
          env:
            {{- include "pecan.env.postgresql" . | nindent 12 }}
            - name: BOOTSTRAP_TIMEOUT
              value: {{ $.Values.betydb.bootstrap.timeoutSeconds | quote }}
      containers:
        - name: add-data
          image: "{{ .Values.image.project }}/data:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - name: data
              mountPath: /data
          env:
            {{- include "pecan.env.postgresql" . | nindent 12 }}
            {{- include "pecan.env.cluster" . | nindent 12 }}
            - name: PSQL
              value: "psql -d {{ .Values.betydb.betyDatabase }} -q -t -c"
      volumes:
        - name: data
          persistentVolumeClaim:
{{- if .Values.persistence.existingClaim }}
            claimName: {{ .Values.persistence.existingClaim }}
{{- else }}
            claimName: {{ include "pecan.fullname" . }}-data
{{- end }}
{{- end }}
