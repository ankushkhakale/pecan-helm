{{- if .Values.postgresql.enabled }}
{{- $name := printf "%s-postgresql" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = required (printf "Secret %s must contain postgresql-password; recover the database credential before upgrading" $name) (get ($existing.data | default dict) "postgresql-password") }}
{{- if and .Values.postgresql.auth.password (ne $password (.Values.postgresql.auth.password | b64enc)) }}
{{- fail "postgresql.auth.password differs from the existing Secret; this chart does not rotate database passwords" }}
{{- end }}
{{- else if .Values.postgresql.auth.password }}
{{- $password = .Values.postgresql.auth.password | b64enc }}
{{- else if .Release.IsUpgrade }}
{{- fail (printf "Secret %s is missing; supply the recovered database credential in postgresql.auth.password before upgrading" $name) }}
{{- else }}
{{- $password = randAlphaNum 32 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "pecan.labels" . | nindent 4 }}
type: Opaque
data:
  postgresql-password: {{ $password | quote }}
{{- end }}
